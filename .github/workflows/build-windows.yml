name: Build Windows bom-compare.exe

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Tidy modules
        run: go mod tidy

      - name: Build bom-compare.exe
        run: go build -trimpath -ldflags "-s -w" -o bom-compare.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bom-compare-windows
          path: bom-compare.exe

      - name: Upload to Release (only for published release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: bom-compare.exe
